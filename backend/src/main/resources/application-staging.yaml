spring:
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:eu-central-1}
        # AWS credentials should be provided via environment variables or IAM roles in staging
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      converse:
        chat:
          enabled: true
          options:
            model: anthropic.claude-sonnet-4-20250514-v1:0
            max-tokens: 4096
            temperature: 0.7
      embedding:
        enabled: true
        options:
          model: amazon.titan-embed-text-v2:0
          dimensions: 1536

# Bedrock-only provider configuration for staging
rag:
  provider: bedrock

logging:
  level:
    org.springframework.ai.bedrock: TRACE
    com.zalando.rag: TRACE