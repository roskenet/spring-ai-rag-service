spring:
  ai:
    openai:
      # In staging we don't set the token in configuration,
      # it will be dynamically replaced from X-TokenInfo-Forward header
      api-key: "dummy-token-will-be-replaced-by-interceptor"
      base-url: https://zllm.data.zalan.do
      chat:
        options:
          model: openai/gpt-4o
          max-tokens: 4096
          temperature: 0.7
      embedding:
        enabled: true
        options:
          model: openai/text-embedding-3-small
          dimensions: 1536

# Special setting for staging - require token from header
rag:
  provider: ${RAG_PROVIDER:zllm}  # Allow environment override
  token:
    require-header-token: true

logging:
  level:
    com.zalando.rag.service.TokenInfoService: DEBUG
    com.zalando.rag.config.DynamicTokenConfiguration: DEBUG
    com.zalando.rag.config.RequestLoggingFilter: DEBUG
    com.zalando.rag.config.BedrockConfiguration: INFO
    com.zalando.rag.service.BedrockAuthenticationProvider: INFO
    com.zalando.rag.service.ZllmAuthenticationProvider: INFO
    com.zalando.rag.service.ProviderHealthService: INFO