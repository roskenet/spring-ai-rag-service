spring:
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:eu-central-1}
        # AWS credentials resolved automatically via default credentials chain
        # Platform team's infrastructure provides IAM role or EC2 instance profile access
      converse:
        chat:
          enabled: true
          options:
            model: anthropic.claude-3-haiku-20240307-v1:0
            max-tokens: 4096
            temperature: 0.7
      embedding:
        enabled: true
        options:
          model: amazon.titan-embed-text-v2:0
          dimensions: 1536

# Bedrock-only provider configuration for staging
rag:
  provider: bedrock

logging:
  level:
    org.springframework.ai.bedrock: TRACE
    com.zalando.rag: TRACE