server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/spring_ai_rag_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db
    validate-on-migrate: false
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.zalando.rag: TRACE
    com.zalando.rag.service.VectorStoreService: TRACE
    org.springframework.ai: DEBUG
    org.springframework.ai.bedrock: TRACE
    org.springframework.ai.vectorstore.pgvector.PgVectorStore: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.springframework.web.client.RestClient: DEBUG
    org.apache.http: DEBUG
    org.apache.http.wire: TRACE
    org.springframework.web: INFO