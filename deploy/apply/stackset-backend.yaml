apiVersion: zalando.org/v1
kind: StackSet
metadata:
  name: "zeos-rag-backend-{{{ENVIRONMENT}}}"
  labels:
    application: "{{{APPLICATION_ID}}}"
    component: "zeos-rag-backend"
    environment: "{{{ENVIRONMENT}}}"
  annotations:
    janitor/ttl: "{{{JANITOR_TTL}}}"
spec:
  routegroup:
    backendPort: 8080
    hosts:
      - "zeos-rag-backend-{{{ENVIRONMENT}}}.{{{CLUSTER_ID}}}.zalan.do"
    routes:
      # Health endpoint doesn't need authentication
      - pathSubtree: "/actuator/health"

      # All API endpoints accept OAuth tokens (forwarded from frontend or direct)
      - pathSubtree: "/api/"
        filters:
          - enableAccessLog(2,3,4,5)
          # Accept OAuth tokens from X-TokenInfo-Forward header or Authorization header
          - oauthTokeninfoAllScope("uid")
          # Forward the tokeninfo to backend for user identification
          - forwardToken("X-TokenInfo-Forward")
  stackLifecycle:
    scaledownTTLSeconds: {{{SCALED_DOWN_STACKS_TTL}}}
    limit: {{SCALED_DOWN_STACKS_TO_KEEP}}
  stackTemplate:
    spec:
      version: "{{{STACK_VERSION}}}"
      replicas: {{{MIN_REPLICAS}}}
      autoscaler:
        minReplicas: {{{MIN_REPLICAS}}}
        maxReplicas: {{{MAX_REPLICAS}}}
        metrics:
          - type: CPU
            averageUtilization: 70
      podTemplate:
        metadata:
          labels:
            application: "{{{APPLICATION_ID}}}"
            component: "zeos-rag-backend"
            environment: "{{{ENVIRONMENT}}}"
            version: "{{{CDP_BUILD_VERSION}}}"
          annotations:
            kubernetes-log-watcher/scalyr-parser: '[{"container": "zeos-rag-backend-{{{ENVIRONMENT}}}", "parser": "spring-boot-3"}]'
        spec:
          containers:
            - name: "zeos-rag-backend-{{{ENVIRONMENT}}}"
              image: "{{{CDP_REGISTRY}}}/{{{BACKEND_IMAGE}}}"
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: "{{{SPRING_PROFILE}}}"
                - name: NAMESPACE
                  value: "{{{NAMESPACE}}}"
                - name: JAVA_TOOL_OPTIONS
                  value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=75 -XX:ActiveProcessorCount=2 -XX:+AlwaysPreTouch -Xlog:gc -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps"
                - name: SPRING_DATASOURCE_URL
                  value: "jdbc:postgresql://{{{DATABASE_ID}}}-{{{ENVIRONMENT}}}-db.{{{NAMESPACE}}}.svc.cluster.local:5432/{{{DB_NAME}}}"
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: "postgres.{{{DATABASE_ID}}}-{{{ENVIRONMENT}}}-db.credentials"
                      key: username
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "postgres.{{{DATABASE_ID}}}-{{{ENVIRONMENT}}}-db.credentials"
                      key: password
                - name: AWS_REGION
                  value: "eu-central-1"
                # AWS credentials for Bedrock (when using explicit credentials)
                - name: AWS_ACCESS_KEY_ID
                  value: "{{{AWS_ACCESS_KEY_ID}}}"  # Optional - K8s service account preferred
                - name: AWS_SECRET_ACCESS_KEY
                  value: "{{{AWS_SECRET_ACCESS_KEY}}}"  # Optional - K8s service account preferred
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: 'zeos-rag-backend-{{{ENVIRONMENT}}}-secrets'
                      key: 'aws_secret_access_key'
              resources:
                requests:
                  cpu: "{{{BACKEND_CPU_REQUEST}}}"
                  memory: "{{{BACKEND_MEMORY_REQUEST}}}"
                limits:
                  cpu: "{{{BACKEND_CPU_REQUEST}}}"
                  memory: "{{{BACKEND_MEMORY_REQUEST}}}"
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /actuator/health
                  port: 8080
                initialDelaySeconds: 30
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /actuator/health
                  port: 8080
                initialDelaySeconds: 60
                timeoutSeconds: 5