Metadata:
  StackName: "{{{APPLICATION_ID}}}-{{{ENVIRONMENT}}}-iam-role"
  Tags:
    application: "{{{APPLICATION_ID}}}"
    environment: "{{{ENVIRONMENT}}}"
AWSTemplateFormatVersion: "2010-09-09"
Description: "IAM Role for zeos-rag-backend to access AWS Bedrock"
Resources:
  IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "{{{APPLICATION_ID}}}-{{{ENVIRONMENT}}}-iam-role"
      Path: /
      AssumeRolePolicyDocument: !Sub
        - '{{{CDP_IAM_ROLE_TRUST_RELATIONSHIP_TEMPLATE}}}'
        - SERVICE_ACCOUNT: "{{{NAMESPACE}}}:zeos-rag-backend-service-account"
      Policies:
        - PolicyName: AllowBedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/amazon.titan-embed-text-v2:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-*"
                  - "arn:aws:bedrock:*::inference-profile/eu.anthropic.claude-*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
