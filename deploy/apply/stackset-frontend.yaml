apiVersion: zalando.org/v1
kind: StackSet
metadata:
  name: "zeos-rag-frontend-{{{ENVIRONMENT}}}"
  labels:
    application: "{{{APPLICATION_ID}}}"
    component: "zeos-rag-frontend"
    environment: "{{{ENVIRONMENT}}}"
  annotations:
    janitor/ttl: "{{{JANITOR_TTL}}}"
spec:
  routegroup:
    backendPort: 3000
    hosts:
      - "zeos-rag-frontend-{{{ENVIRONMENT}}}.{{{CLUSTER_ID}}}.zalan.do"
    routes:
      - pathSubtree: "/"
  stackLifecycle:
    scaledownTTLSeconds: {{{SCALED_DOWN_STACKS_TTL}}}
    limit: {{SCALED_DOWN_STACKS_TO_KEEP}}
  stackTemplate:
    spec:
      version: "{{{STACK_VERSION}}}"
      replicas: {{{MIN_REPLICAS}}}
      autoscaler:
        minReplicas: {{{MIN_REPLICAS}}}
        maxReplicas: {{{MAX_REPLICAS}}}
        metrics:
          - type: CPU
            averageUtilization: 70
      podTemplate:
        metadata:
          labels:
            application: "{{{APPLICATION_ID}}}"
            component: "zeos-rag-frontend"
            environment: "{{{ENVIRONMENT}}}"
            version: "{{{CDP_BUILD_VERSION}}}"
          annotations:
            kubernetes-log-watcher/scalyr-parser: '[{"container": "zeos-rag-frontend-{{{ENVIRONMENT}}}", "parser": "json"}]'
        spec:
          containers:
            - name: "zeos-rag-frontend-{{{ENVIRONMENT}}}"
              image: "{{{CDP_REGISTRY}}}/{{{FRONTEND_IMAGE}}}"
              env:
                - name: NODE_ENV
                  value: "production"
                - name: NEXT_PUBLIC_API_URL
                  value: "https://zeos-rag-backend-{{{ENVIRONMENT}}}.{{{NAMESPACE}}}.zalan.do"
                - name: PORT
                  value: "3000"
                - name: HOSTNAME
                  value: "0.0.0.0"
              resources:
                requests:
                  cpu: "{{{FRONTEND_CPU_REQUEST}}}"
                  memory: "{{{FRONTEND_MEMORY_REQUEST}}}"
                limits:
                  cpu: "{{{FRONTEND_CPU_REQUEST}}}"
                  memory: "{{{FRONTEND_MEMORY_REQUEST}}}"
              ports:
                - containerPort: 3000
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 15
                timeoutSeconds: 5
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 30
                timeoutSeconds: 5
                periodSeconds: 30