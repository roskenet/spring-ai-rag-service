apiVersion: zalando.org/v1
kind: FabricGateway
metadata:
  name: "zeos-rag-backend-{{{ENVIRONMENT}}}-fabric"
  labels:
    application: "{{{APPLICATION_ID}}}"
    component: "zeos-rag-backend"
    environment: "{{{ENVIRONMENT}}}"
  annotations:
    janitor/ttl: "{{{JANITOR_TTL}}}"
spec:
  # For Stacksets, Fabric Gateway will work with an external operator
  x-external-service-provider:
    hosts:
      - zeos-rag-backend-{{{ENVIRONMENT}}}.{{{CLUSTER_ID}}}.zalan.do
    stackSetName: zeos-rag-backend-{{{ENVIRONMENT}}}
    stackVersion: {{{STACK_VERSION}}}

  # Service administrators
  x-fabric-admins:
    - sargutin

  # API endpoints for the RAG service
  paths:
    # Document management endpoints
    /api/documents:
      get: {}  # List documents
      post: {} # Upload document

    /api/documents/{id}:
      get: {}    # Get document details
      delete: {} # Delete document

    /api/documents/upload:
      post: {}   # Upload endpoint

    # Chat/Query endpoints
    /api/chat/ask:
      post: {}   # Ask questions to RAG system

    /api/chat/history:
      get: {}    # Get chat history

    # Configuration endpoints
    /api/configuration:
      get: {}    # Get RAG configuration
      post: {}   # Update configuration

    /api/configuration/chunking:
      get: {}    # Get chunking strategies
      put: {}    # Update chunking config

    # Analytics endpoints
    /api/analytics/queries:
      get: {}    # Query metrics

    /api/analytics/documents:
      get: {}    # Document metrics

    /api/analytics/system:
      get: {}    # System metrics

    # Health check (no auth required)
    /actuator/health:
      get: {}